name: Code Review

on:
  pull_request:

concurrency:
  group: code-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: JezielMoura/code-review-agent-action@e3eef4727def225254831c1c87b47bd5a906ba62
        with:
          openai-api-url: ${{ secrets.OPENAI_API_URL }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: deepseek-v4-flash
