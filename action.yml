name: 'Code Review Agent Action'
description: 'Reviews PRs using any endpoint compatible with the OpenAI chat completions API'
branding:
  icon: 'code'
  color: 'blue'
author: 'JezielMoura'

inputs:
  openai-api-url:
    description: 'Base URL compatible with the OpenAI chat completions API (e.g. https://api.openai.com/v1 or https://opencode.example.com/v1)'
    required: true
  openai-api-key:
    description: 'Authentication token for the endpoint (e.g. sk-...)'
    required: true
  model:
    description: 'Name of the model to use in the call (e.g. gpt-4o-mini)'
    required: true
  repo-api-url:
    description: 'Base URL of the repository API, used to post the review comment (e.g. https://api.github.com or https://forge.example.com/api/v1)'
    required: false
    default: 'https://api.github.com'
  repo-api-token:
    description: 'Token with write permission on the repository (to post the review comment). Default: github.token on GitHub.'
    required: false
  repo-api-kind:
    description: 'Repository API type: github (default) or forgejo'
    required: false
    default: 'github'
  base-ref:
    description: 'Local ref (or commit) of the base branch used by git diff to compute the PR diff (e.g. origin/main). Default: origin/<pull request base branch>.'
    required: false
  file-patterns:
    description: 'Comma-separated glob patterns of files to review. Prefix a pattern with ! to exclude (e.g. **/*.ts,!**/*.spec.ts)'
    required: false
    default: '**/*.py,**/*.js,**/*.jsx,**/*.mjs,**/*.cjs,**/*.ts,**/*.tsx,**/*.cs,**/*.java,**/*.c,**/*.h,**/*.cpp,**/*.cc,**/*.hpp,**/*.go,**/*.rs,**/*.kt,**/*.kts,**/*.swift,**/*.php,**/*.rb,**/*.html,**/*.css,**/*.scss,**/*.vue,**/*.svelte,**/*.sql,**/*.sh,**/*.yaml,**/*.yml,**/*.toml,**/*.json,**/*.md'
  max-diff-size:
    description: 'Maximum size (in characters) of the diff sent to the LLM'
    required: false
    default: '300000'

runs:
  using: 'composite'
  steps:
    - name: Checkout source code (PR head)
      if: github.event_name == 'pull_request'
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0

    - name: Install dependencies (prod only)
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --omit=dev --no-audit --no-fund --loglevel=error

    - name: Run review
      id: review
      if: github.event_name == 'pull_request'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: ./node_modules/.bin/flue run src/agent.ts --message "Review pr ${{ github.event.pull_request.number }}"
      env:
        REPO_API_URL: ${{ inputs.repo-api-url }}
        REPO_API_TOKEN: ${{ inputs.repo-api-token || github.token }}
        REPO_API_KIND: ${{ inputs.repo-api-kind }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_REF: ${{ inputs.base-ref || format('origin/{0}', github.event.pull_request.base.ref) }}
        FILE_PATTERNS: ${{ inputs.file-patterns }}
        MAX_DIFF_SIZE: ${{ inputs.max-diff-size }}
        OPENAI_API_URL: ${{ inputs.openai-api-url }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        MODEL: ${{ inputs.model }}
        WORKSPACE_PATH: ${{ github.workspace }}
        NODE_OPTIONS: '--max-old-space-size=384'