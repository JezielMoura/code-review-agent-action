name: 'Code Review Agent Action'
description: 'Revisa PRs usando qualquer endpoint compatível com a API de chat completions da OpenAI'
branding:
  icon: 'code'
  color: 'blue'
author: 'JezielMoura'

inputs:
  openai-api-url:
    description: 'URL base compatível com a API de chat completions da OpenAI (ex: https://api.openai.com/v1 ou https://opencode.exemplo.com/v1)'
    required: true
  openai-api-key:
    description: 'Token de autenticação do endpoint (ex: sk-...)'
    required: true
  model:
    description: 'Nome do modelo a ser usado na chamada (ex: gpt-4o-mini)'
    required: true
  repo-api-url:
    description: 'URL base da API do repositório, usada para postar o comentário do review (ex: https://api.github.com ou https://forge.exemplo.com/api/v1)'
    required: false
    default: 'https://api.github.com'
  repo-api-token:
    description: 'Token com permissão de escrita no repositório (para postar o comentário do review). Padrão: github.token no GitHub.'
    required: false
  repo-api-kind:
    description: 'Tipo da API do repositório: github (padrão) ou forgejo'
    required: false
    default: 'github'
  base-ref:
    description: 'Ref local (ou commit) da branch base usado pelo git diff para calcular o diff do PR (ex: origin/main). Padrão: origin/<branch base do pull request>.'
    required: false
  file-patterns:
    description: 'Padrões glob (separados por vírgula) dos arquivos a revisar. Prefixe um padrão com ! para excluir (ex: **/*.ts,!**/*.spec.ts)'
    required: false
    default: '**/*.py,**/*.js,**/*.jsx,**/*.mjs,**/*.cjs,**/*.ts,**/*.tsx,**/*.cs,**/*.java,**/*.c,**/*.h,**/*.cpp,**/*.cc,**/*.hpp,**/*.go,**/*.rs,**/*.kt,**/*.kts,**/*.swift,**/*.php,**/*.rb,**/*.html,**/*.css,**/*.scss,**/*.vue,**/*.svelte,**/*.sql,**/*.sh,**/*.yaml,**/*.yml,**/*.toml,**/*.json,**/*.md'
  max-diff-size:
    description: 'Tamanho máximo (em caracteres) do diff enviado ao LLM'
    required: false
    default: '300000'

runs:
  using: 'composite'
  steps:
    - name: Checkout do código fonte (head do PR)
      if: github.event_name == 'pull_request'
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0

    - name: Instalar dependências (prod apenas)
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --omit=dev --no-audit --no-fund --loglevel=error

    - name: Executar review
      id: review
      if: github.event_name == 'pull_request'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: ./node_modules/.bin/flue run src/agent.ts --message "Review pr ${{ github.event.pull_request.number }}"
      env:
        REPO_API_URL: ${{ inputs.repo-api-url }}
        REPO_API_TOKEN: ${{ inputs.repo-api-token || github.token }}
        REPO_API_KIND: ${{ inputs.repo-api-kind }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_REF: ${{ inputs.base-ref || format('origin/{0}', github.event.pull_request.base.ref) }}
        FILE_PATTERNS: ${{ inputs.file-patterns }}
        MAX_DIFF_SIZE: ${{ inputs.max-diff-size }}
        OPENAI_API_URL: ${{ inputs.openai-api-url }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        MODEL: ${{ inputs.model }}
        WORKSPACE_PATH: ${{ github.workspace }}
        NODE_OPTIONS: '--max-old-space-size=384'